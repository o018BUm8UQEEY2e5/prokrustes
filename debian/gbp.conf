# git-buildpackage configuration for this repository's DEP-14 layout:
# upstream code on the "upstream" branch, packaging on "debian/unstable",
# upstream tarballs tracked via pristine-tar.
[DEFAULT]
upstream-branch = upstream
debian-branch = debian/unstable
upstream-tag = upstream/%(version)s
debian-tag = debian/%(version)s
pristine-tar = True
