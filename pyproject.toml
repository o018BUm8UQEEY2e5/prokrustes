[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prokrustes"
description = "Fill text templates by constraining a llama.cpp server with a GBNF grammar, so every value is guaranteed to match its regex."
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "yvfu", email = "yvfu@tutamail.com" }]
keywords = [
    "gbnf",
    "llama.cpp",
    "template",
    "code-generation",
    "constrained-decoding",
    "grammar",
    "regex",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Processing :: General",
    "Topic :: Utilities",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/o018BUm8UQEEY2e5/prokrustes"

[project.scripts]
prokrustes = "prokrustes.cli:main"

[tool.setuptools.dynamic]
version = { attr = "prokrustes.__version__" }

[tool.setuptools.packages.find]
where = ["src"]